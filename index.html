<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💩同時うんこ💩 🚽チャレンジ🚽</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

.container{
    padding:20px;
}

h1{
    margin-top:20px;
    font-size:34px;
    line-height:1.5;
}

.subtitle{
    opacity:0.7;
    margin-bottom:30px;
    font-size:20px;
}

#gameScreen{
    display:none;
}

.nameButton{

    width:85%;
    max-width:320px;

    font-size:30px;
    font-weight:bold;

    padding:24px;

    margin:15px auto;

    border:none;
    border-radius:24px;

    display:block;

    color:white;
}

.redBtn{
    background:#c62828;
}

.blueBtn{
    background:#1565c0;
}

.yellowBtn{
    background:#f9a825;
    color:black;
}

.mainButton{

    width:85%;
    max-width:340px;

    font-size:32px;
    font-weight:bold;

    padding:24px;

    margin:20px auto;

    border:none;
    border-radius:24px;

    display:block;
}

.start{
    background:#00c853;
    color:white;
}

.end{
    background:#d50000;
    color:white;
}

.change{
    background:#666;
    color:white;
}

.card{

    width:88%;
    max-width:360px;

    margin:18px auto;

    padding:24px;

    border-radius:24px;

    font-size:34px;
    font-weight:bold;
}

.online{
    box-shadow:0 0 25px currentColor;
}

.offline{
    opacity:0.35;
}

.red{
    background:#400;
    color:#ff5252;
}

.blue{
    background:#003;
    color:#40c4ff;
}

.yellow{
    background:#4a3b00;
    color:#ffd740;
}

#players{
    margin-top:30px;
}

#success{

    display:none;

    margin-top:35px;

    font-size:48px;
    font-weight:bold;

    color:#00ff6a;

    animation:flash 1s infinite;

    line-height:1.6;
}

@keyframes flash{
    0%{opacity:1;}
    50%{opacity:0.3;}
    100%{opacity:1;}
}

#me{
    font-size:24px;
    margin-top:10px;
    opacity:0.8;
}

</style>

</head>
<body>

<div class="container">

<!-- 名前選択 -->

<div id="selectScreen">

    <h1>
        💩同時うんこ💩
        <br>
        🚽チャレンジ🚽
    </h1>

    <div class="subtitle">
        あなたを選択
    </div>

    <button class="nameButton redBtn"
        onclick="selectPlayer('shori')">

        🔴 しょうり

    </button>

    <button class="nameButton blueBtn"
        onclick="selectPlayer('jokura')">

        🔵 城倉

    </button>

    <button class="nameButton yellowBtn"
        onclick="selectPlayer('masai')">

        🟡 まさい

    </button>

</div>

<!-- メイン -->

<div id="gameScreen">

    <h1>
        💩同時うんこ💩
        <br>
        🚽チャレンジ🚽
    </h1>

    <div id="me"></div>

    <button class="mainButton start"
        onclick="startPoop()">

        🚽 開始

    </button>

    <button class="mainButton end"
        onclick="endPoop()">

        終了

    </button>

    <button class="mainButton change"
        onclick="changePlayer()">

        👤 プレイヤー変更

    </button>

    <div id="players"></div>

    <div id="success">

        🚨３人同時🚨
        <br>
        🎊　達成　🎊

    </div>

</div>

</div>

<script>

/* Firebase */

const firebaseConfig = {
  apiKey: "AIzaSyAvu7p1AICFiJuzJvmT_LxFUsjp0zDwDOQ",
  authDomain: "isaac-toilet-42f74.firebaseapp.com",
  databaseURL: "https://isaac-toilet-42f74-default-rtdb.firebaseio.com",
  projectId: "isaac-toilet-42f74",
  storageBucket: "isaac-toilet-42f74.firebasestorage.app",
  messagingSenderId: "842303796255",
  appId: "1:842303796255:web:b06e318b04994f5dee512a"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* 名前 */

const names = {
    shori:"🔴 しょうり",
    jokura:"🔵 城倉",
    masai:"🟡 まさい"
};

let me = localStorage.getItem("toiletPlayer");

/* 初期表示 */

if(me){
    showGame();
}

/* 選択 */

function selectPlayer(player){

    me = player;

    localStorage.setItem(
        "toiletPlayer",
        player
    );

    showGame();
}

/* 画面切替 */

function showGame(){

    document.getElementById(
        "selectScreen"
    ).style.display = "none";

    document.getElementById(
        "gameScreen"
    ).style.display = "block";

    document.getElementById(
        "me"
    ).innerText =
        "あなた： " + names[me];
}

/* プレイヤー変更 */

function changePlayer(){

    endPoop();

    localStorage.removeItem(
        "toiletPlayer"
    );

    location.reload();
}

/* 開始 */

function startPoop(){

    db.ref("players/" + me).set({
        active:true
    });

    db.ref("players/" + me)
      .onDisconnect()
      .set({
          active:false
      });
}

/* 終了 */

function endPoop(){

    if(!me) return;

    db.ref("players/" + me).set({
        active:false
    });
}

/* リアルタイム監視 */

db.ref("players").on("value", snapshot => {

    if(!me) return;

    const data = snapshot.val() || {};

    const myActive =
        data[me]?.active || false;

    const playersDiv =
        document.getElementById("players");

    const success =
        document.getElementById("success");

    if(!myActive){

        playersDiv.innerHTML = "";

        success.style.display = "none";

        return;
    }

    let html = "";

    let count = 0;

    html += makeCard(
        "🔴 しょうり",
        data.shori?.active,
        "red"
    );

    html += makeCard(
        "🔵 城倉",
        data.jokura?.active,
        "blue"
    );

    html += makeCard(
        "🟡 まさい",
        data.masai?.active,
        "yellow"
    );

    if(data.shori?.active) count++;
    if(data.jokura?.active) count++;
    if(data.masai?.active) count++;

    playersDiv.innerHTML = html;

    if(count >= 3){
        success.style.display = "block";
    }else{
        success.style.display = "none";
    }

});

/* カード */

function makeCard(name, active, color){

    return `
    <div class="card ${color}
        ${active ? 'online' : 'offline'}">

        ${active ? '🟢' : '⚪'}

        ${name}

    </div>
    `;
}

</script>

</body>
</html>
