<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚽 同時うんこチャレンジ 🚽</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

.container{
    padding:20px;
}

h1{
    font-size:34px;
    margin-top:20px;
}

select{
    font-size:24px;
    padding:12px;
    border-radius:12px;
    margin-top:15px;
}

button{
    width:85%;
    max-width:320px;
    font-size:30px;
    padding:22px;
    margin:15px 0;
    border:none;
    border-radius:20px;
    font-weight:bold;
}

.start{
    background:#00c853;
    color:white;
}

.end{
    background:#d50000;
    color:white;
}

.card{
    margin:15px auto;
    width:88%;
    max-width:360px;
    border-radius:22px;
    padding:22px;
    font-size:34px;
    font-weight:bold;
}

.online{
    box-shadow:0 0 25px currentColor;
}

.offline{
    opacity:0.35;
}

.red{
    background:#400;
    color:#ff5252;
}

.blue{
    background:#003;
    color:#40c4ff;
}

.yellow{
    background:#4a3b00;
    color:#ffd740;
}

#players{
    margin-top:30px;
}

#hiddenMessage{
    margin-top:35px;
    font-size:24px;
    opacity:0.7;
}

#success{
    display:none;
    margin-top:35px;
    font-size:46px;
    color:#00ff6a;
    font-weight:bold;
    animation:flash 1s infinite;
}

@keyframes flash{
    0%{opacity:1;}
    50%{opacity:0.3;}
    100%{opacity:1;}
}

</style>

</head>
<body>

<div class="container">

<h1>🚽 同時うんこチャレンジ 🚽</h1>

<select id="playerSelect">
    <option value="shori">🔴 しょうり</option>
    <option value="jokura">🔵 城倉</option>
    <option value="masai">🟡 まさい</option>
</select>

<br>

<button class="start" onclick="startPoop()">
🚽 開始
</button>

<br>

<button class="end" onclick="endPoop()">
終了
</button>

<div id="hiddenMessage">
🚫 自分が🚽中の間だけ表示されます
</div>

<div id="players"></div>

<div id="success">
🚨 3人同時達成！！！
</div>

</div>

<script>

/* Firebase */

const firebaseConfig = {
  apiKey: "AIzaSyAvu7p1AICFiJuzJvmT_LxFUsjp0zDwDOQ",
  authDomain: "isaac-toilet-42f74.firebaseapp.com",
  databaseURL: "https://isaac-toilet-42f74-default-rtdb.firebaseio.com",
  projectId: "isaac-toilet-42f74",
  storageBucket: "isaac-toilet-42f74.firebasestorage.app",
  messagingSenderId: "842303796255",
  appId: "1:842303796255:web:b06e318b04994f5dee512a"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* 開始 */

function startPoop(){

    const me =
        document.getElementById("playerSelect").value;

    db.ref("players/" + me).set({
        active:true
    });
}

/* 終了 */

function endPoop(){

    const me =
        document.getElementById("playerSelect").value;

    db.ref("players/" + me).set({
        active:false
    });
}

/* リアルタイム監視 */

db.ref("players").on("value", snapshot => {

    const data = snapshot.val() || {};

    const me =
        document.getElementById("playerSelect").value;

    const myActive =
        data[me]?.active || false;

    const playersDiv =
        document.getElementById("players");

    const hiddenMessage =
        document.getElementById("hiddenMessage");

    const success =
        document.getElementById("success");

    if(!myActive){

        playersDiv.innerHTML = "";

        hiddenMessage.style.display = "block";

        success.style.display = "none";

        return;
    }

    hiddenMessage.style.display = "none";

    let html = "";

    let count = 0;

    html += makeCard(
        "しょうり",
        data.shori?.active,
        "red"
    );

    html += makeCard(
        "城倉",
        data.jokura?.active,
        "blue"
    );

    html += makeCard(
        "まさい",
        data.masai?.active,
        "yellow"
    );

    if(data.shori?.active) count++;
    if(data.jokura?.active) count++;
    if(data.masai?.active) count++;

    playersDiv.innerHTML = html;

    if(count >= 3){
        success.style.display = "block";
    }else{
        success.style.display = "none";
    }

});

/* カード生成 */

function makeCard(name, active, color){

    return `
    <div class="card ${color}
        ${active ? 'online' : 'offline'}">

        ${active ? '🟢' : '⚪'}
        ${name}

    </div>
    `;
}

</script>

</body>
</html>
