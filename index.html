<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚽 同時うんこチャレンジ</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

.container{
    padding:20px;
}

h1{
    font-size:32px;
    margin-top:20px;
}

select{
    font-size:24px;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

button{
    width:80%;
    max-width:300px;
    font-size:28px;
    padding:20px;
    margin:15px 0;
    border:none;
    border-radius:20px;
    font-weight:bold;
}

.start{
    background:#00c853;
    color:white;
}

.end{
    background:#d50000;
    color:white;
}

.card{
    margin:15px auto;
    width:85%;
    max-width:350px;
    border-radius:20px;
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

.online{
    box-shadow:0 0 20px currentColor;
}

.offline{
    opacity:0.4;
}

.red{
    background:#400;
    color:#ff5252;
}

.blue{
    background:#003;
    color:#40c4ff;
}

.yellow{
    background:#443300;
    color:#ffd740;
}

#players{
    margin-top:30px;
}

#hiddenMessage{
    margin-top:30px;
    font-size:22px;
    opacity:0.7;
}

#success{
    display:none;
    margin-top:30px;
    font-size:42px;
    color:#00ff6a;
    font-weight:bold;
    animation:flash 1s infinite;
}

@keyframes flash{
    0%{opacity:1;}
    50%{opacity:0.3;}
    100%{opacity:1;}
}

</style>
</head>
<body>

<div class="container">

<h1>🚽 同時うんこチャレンジ 🚽</h1>

<select id="playerSelect">
    <option value="shori">🔴 しょうり</option>
    <option value="jokura">🔵 城倉</option>
    <option value="masai">🟡 まさい</option>
</select>

<br>

<button class="start" onclick="startPoop()">
🚽 開始
</button>

<br>

<button class="end" onclick="endPoop()">
終了
</button>

<div id="hiddenMessage">
🚫 自分が🚽中の間だけ表示されます
</div>

<div id="players"></div>

<div id="success">
🚨 3人同時達成！！！
</div>

</div>

<script>

let myActive = false;

const players = {
    shori:{
        name:"しょうり",
        color:"red",
        active:false
    },
    jokura:{
        name:"城倉",
        color:"blue",
        active:false
    },
    masai:{
        name:"まさい",
        color:"yellow",
        active:false
    }
};

function startPoop(){

    const me =
        document.getElementById("playerSelect").value;

    players[me].active = true;

    myActive = true;

    render();
}

function endPoop(){

    const me =
        document.getElementById("playerSelect").value;

    players[me].active = false;

    myActive = false;

    render();
}

function render(){

    const area =
        document.getElementById("players");

    const hidden =
        document.getElementById("hiddenMessage");

    const success =
        document.getElementById("success");

    if(!myActive){

        area.innerHTML = "";

        hidden.style.display = "block";

        success.style.display = "none";

        return;
    }

    hidden.style.display = "none";

    let html = "";

    let count = 0;

    for(const key in players){

        const p = players[key];

        if(p.active) count++;

        html += `
        <div class="card ${p.color}
            ${p.active ? 'online' : 'offline'}">

            ${p.active ? '🟢' : '⚪'}
            ${p.name}

        </div>
        `;
    }

    area.innerHTML = html;

    if(count >= 3){
        success.style.display = "block";
    }else{
        success.style.display = "none";
    }
}

</script>

</body>
</html>
